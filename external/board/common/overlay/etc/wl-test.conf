# Fixed test targets for this lab; keep them constant so runs are comparable.
# Override per lab by editing this file in the overlay (or a board overlay).
#WL_SSID=wl-lab-ap          # dedicated access point
#WL_PSK=changeme            # empty/unset = open network
#WL_IPERF_SERVER=192.168.1.2
#WL_BLE_ADDR=AA:BB:CC:DD:EE:FF   # dedicated BLE peripheral
#WL_WIFI_MODULE=            # driver module to unload/load (unset = skip); none for IW612 on mainline
#WL_CYCLES=10               # iterations for cycle tests
#WL_SOAK_SECS=60            # BLE scan/connection soak time
#WL_IPERF_SECS=30
#WL_MIN_MBPS=10             # throughput floor
#WL_LEAK_KB=2048            # allowed slab growth over a cycle test
#WL_SUSPEND_CYCLES=3
#WL_SUSPEND_MODE=mem
